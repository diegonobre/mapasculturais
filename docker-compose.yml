services:
  mapas:
    env_file:
      - .env
    build:
      context: ./
      dockerfile: docker/Dockerfile
    # Código, scripts, php.ini e www.conf já são copiados para a imagem pelo docker/Dockerfile.
    # Não montar arquivos do repositório aqui: em plataformas como o Coolify o repositório não existe
    # no host e o Docker cria diretórios no lugar dos arquivos, quebrando o deploy.
    volumes:
      - ./docker-data/assets:/var/www/html/assets
      - ./docker-data/public-files:/var/www/html/files
      - ./docker-data/private-files:/var/www/var/private-files

    links:
      - db
      - redis
      - sessions

    depends_on:
      - db
      - redis
      - sessions

    stdin_open: true
    tty: true

  redis:
    image: redis:6
    command: --maxmemory 1024Mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  sessions:
    image: redis:6
    restart: unless-stopped
    command: --maxmemory 512Mb --maxmemory-policy allkeys-lru
    volumes:
      - ./docker-data/sessions:/data

  db:
    build:
      context: ./
      dockerfile: docker/production/Dockerfile.db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=mapas
      - POSTGRES_USER=mapas
      - POSTGRES_DB=mapas
    volumes:
      - ./docker-data/db-data:/var/lib/postgresql/data

  nginx:
    # a configuração do nginx é copiada para a imagem (ver docker/production/Dockerfile.nginx)
    build:
      context: ./
      dockerfile: docker/production/Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - ./docker-data/public-files:/var/www/html/files
      - ./docker-data/assets:/var/www/html/assets
    ports:
     - "8091:80"
    depends_on:
      - mapas
    links:
      - mapas

networks:
  mapasccnet:
    external:
      name: mapasccnet
